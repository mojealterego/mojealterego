name: Refresh project catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: project-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify catalog tooling before mutation
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh README catalog from GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_project_catalog.py
      - name: Verify generated profile
        run: |
          python scripts/check_profile_a11y.py README.md
          git diff --check
      - name: Open controlled catalog update PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/project-catalog
          delete-branch: true
          commit-message: "chore: refresh project catalog"
          title: "chore: refresh project catalog"
          body: |
            Automated refresh of repository metadata in the generated flagship-project catalog.
            Project maturity statuses are never promoted automatically.
          add-paths: |
            README.md
