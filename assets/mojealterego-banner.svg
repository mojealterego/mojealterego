```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOJEALTEREGO - Niezawodna Edycja Złota</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Great+Vibes&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body, html {
            width: 100%;
            height: 100%;
            /* Ciemne, głębokie, eleganckie tło zamiast czarnej plamy */
            background-color: #030507;
            background-image: radial-gradient(circle at 50% 50%, #131c21 0%, #030507 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            color: #FFFFFF;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            z-index: 10;
        }

        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(218, 165, 32, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        .gold-text {
            /* Fallback: Jeśli wszystko zawiedzie, to wyświetli się to nasycone złoto */
            color: #FFD700; 
            text-shadow: 0px 4px 15px rgba(255, 215, 0, 0.2);
        }

        /* Ulepszenie dla przeglądarek, które to obsługują (gradient przypominający prawdziwy metal) */
        @supports (-webkit-background-clip: text) {
            .gold-text {
                background: linear-gradient(180deg, #FFF9C4 0%, #FFD700 25%, #DAA520 50%, #FFD700 75%, #996515 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                color: transparent; /* Ukrywa fallback */
                filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.8));
            }
        }

        .logo-box {
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        .name {
            font-size: clamp(18px, 3vw, 26px);
            letter-spacing: 12px;
            font-weight: 700;
            margin: 10px 0;
            text-transform: uppercase;
        }

        .title {
            font-size: clamp(35px, 7vw, 85px);
            letter-spacing: clamp(6px, 2vw, 18px);
            font-weight: 900;
            margin: 5px 0;
        }

        .separator {
            width: 100%;
            max-width: 350px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.8), transparent);
            margin: 25px 0;
            position: relative;
        }

        .separator::after {
            content: '✦';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 16px;
            background: #0d1216;
            padding: 0 15px;
        }

        .tags {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(10px, 1.5vw, 15px);
            letter-spacing: 5px;
            font-weight: 600;
            color: #D9E5E5;
            margin: 20px 0;
            line-height: 2;
            word-spacing: 5px;
        }

        .tags span {
            color: #FFD700;
            font-weight: 800;
            margin: 0 5px;
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(45px, 6vw, 70px);
            color: #FFD700;
            margin-top: 10px;
            transform: rotate(-4deg);
            padding-right: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
    </style>
</head>
<body>
    <!-- Światło w tle -->
    <div class="ambient-glow"></div>

    <div class="container">
        
        <div class="logo-box">
            <svg width="240" height="190" viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Super bezpieczny gradient SVG -->
                    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFF9C4" />
                        <stop offset="20%" stop-color="#FFD700" />
                        <stop offset="60%" stop-color="#DAA520" />
                        <stop offset="100%" stop-color="#996515" />
                    </linearGradient>
                </defs>
                
                <!-- Korona królewska -->
                <g transform="translate(70, 10)">
                    <path d="M10,75 L90,75 L90,68 L10,68 Z" fill="url(#gold)" />
                    <path d="M15,63 L5,20 L35,40 L50,5 L65,40 L95,20 L85,63 Z" fill="url(#gold)" />
                    <circle cx="5" cy="15" r="5" fill="url(#gold)" />
                    <circle cx="35" cy="35" r="4" fill="url(#gold)" />
                    <circle cx="65" cy="35" r="4" fill="url(#gold)" />
                    <circle cx="95" cy="15" r="5" fill="url(#gold)" />
                    <!-- Jasny refleks na środku korony -->
                    <path d="M50,0 C42,-10 58,-10 50,0 Z" fill="#FFF9C4" />
                </g>
                
                <!-- Inicjały AM -->
                <text x="120" y="140" font-family="'Cinzel', serif" font-weight="900" font-size="85" text-anchor="middle" fill="url(#gold)">AM</text>
                
                <!-- Lewa gałązka laurowa -->
                <g transform="translate(120, 150)">
                    <path d="M -15,0 C -60,20 -110,-20 -80,-100" fill="none" stroke="url(#gold)" stroke-width="4"/>
                    <!-- Solidne, wektorowe liście -->
                    <path d="M -15,-5 L -35,-25 L -20,-35 Z" fill="url(#gold)" />
                    <path d="M -30,-30 L -55,-50 L -40,-60 Z" fill="url(#gold)" />
                    <path d="M -50,-60 L -75,-80 L -60,-90 Z" fill="url(#gold)" />
                    <path d="M -65,-90 L -85,-105 L -70,-115 Z" fill="url(#gold)" />
                    <path d="M -10,-20 L -5,-40 L 10,-25 Z" fill="url(#gold)" />
                    <path d="M -25,-45 L -20,-65 L -5,-50 Z" fill="url(#gold)" />
                </g>
                
                <!-- Prawa gałązka laurowa (odbicie lustrzane) -->
                <g transform="translate(120, 150) scale(-1, 1)">
                    <path d="M -15,0 C -60,20 -110,-20 -80,-100" fill="none" stroke="url(#gold)" stroke-width="4"/>
                    <path d="M -15,-5 L -35,-25 L -20,-35 Z" fill="url(#gold)" />
                    <path d="M -30,-30 L -55,-50 L -40,-60 Z" fill="url(#gold)" />
                    <path d="M -50,-60 L -75,-80 L -60,-90 Z" fill="url(#gold)" />
                    <path d="M -65,-90 L -85,-105 L -70,-115 Z" fill="url(#gold)" />
                    <path d="M -10,-20 L -5,-40 L 10,-25 Z" fill="url(#gold)" />
                    <path d="M -25,-45 L -20,-65 L -5,-50 Z" fill="url(#gold)" />
                </g>
            </svg>
        </div>

        <div class="name gold-text">ANDRZEJ MIKULSKI</div>
        
        <div class="separator"></div>

        <h1 class="title gold-text">MOJEALTEREGO</h1>

        <div class="tags">
            AI <span>·</span> AGENTS <span>·</span> MCP <span>·</span> APPS <span>·</span> RESEARCH <span>·</span> ART
        </div>

        <div class="signature">Mojealterego</div>

    </div>
</body>
</html>```
